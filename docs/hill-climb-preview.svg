  <circle cx="1010" cy="152" r="70" fill="#ffe7a2" opacity=".18" filter="url(#soft)"/>
  <circle cx="1010" cy="152" r="39" fill="#fff0ad"/>
  <g fill="#fff" opacity=".72">
