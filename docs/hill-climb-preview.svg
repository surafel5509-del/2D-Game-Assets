<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Trailblazer: Hill Climb — gameplay preview</title>
  <desc id="desc">A red off-road jeep climbs a green endless hill beneath a bright sky, with distance, fuel, coin and boost controls.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#58b8e3"/><stop offset="1" stop-color="#d9f3ef"/></linearGradient>
    <linearGradient id="earth" x2="0" y2="1"><stop stop-color="#96613f"/><stop offset="1" stop-color="#583c38"/></linearGradient>
    <linearGradient id="red" x2="0" y2="1"><stop stop-color="#f47751"/><stop offset="1" stop-color="#c83d38"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#c2f0ec"/><stop offset="1" stop-color="#65b4c3"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#1c3844" stop-opacity=".96"/><stop offset="1" stop-color="#142932" stop-opacity=".91"/></linearGradient>
    <linearGradient id="fuel" x2="1"><stop stop-color="#e84e3b"/><stop offset="1" stop-color="#ff9a53"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
