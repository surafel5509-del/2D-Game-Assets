    <text x="640" y="108" fill="#ffd78c" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="2">METERS</text>
    <text x="640" y="126" fill="#c4dcd2" font-size="9" text-anchor="middle">RUN  +18 COINS</text>

    <rect x="1000" y="20" width="258" height="116" rx="17" fill="url(#panel)" stroke="#d8f1db" stroke-opacity=".2"/>
    <text x="1235" y="46" fill="#aac8bc" font-size="10" font-weight="700" text-anchor="end" letter-spacing="1.4">STAGE  1 / 04</text>
    <text x="1235" y="67" fill="#f5ffed" font-size="15" font-weight="700" text-anchor="end">GREEN HILLS</text>
    <text x="1235" y="89" fill="#c3d7cc" font-size="10" text-anchor="end">ENGINE  2    TYRES  1</text>
    <text x="1040" y="113" fill="#dcece2" font-size="9" font-weight="700" letter-spacing="1">BOOST</text>
    <rect x="1085" y="105" width="150" height="10" rx="5" fill="#07191f"/>
    <rect x="1085" y="105" width="107" height="10" rx="5" fill="#53cbe0"/>
