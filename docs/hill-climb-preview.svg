  </g>

  <!-- Coins and fuel can -->
  <g transform="translate(853 329)"><circle r="20" fill="#b77b25"/><circle r="16" fill="#f7bd42" stroke="#ffe795" stroke-width="3"/><path d="M-5-8h8l-5 7h7l-11 12 3-9h-7z" fill="#fff2be"/></g>
