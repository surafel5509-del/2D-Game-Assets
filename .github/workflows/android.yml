name: Lumen2D Engine CI

on:
  push:
    branches: [ main, 'arena/**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish/refresh the "latest-build" release with the APK'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    name: Engine core tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Run engine-core test suite
        run: gradle :engine-core:engineTests --stacktrace

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.14.3

      - name: Assemble debug + release APKs
        run: ./gradlew :app-android:assembleDebug :app-android:assembleRelease --stacktrace

      - name: Show APK outputs
        run: find app-android/build/outputs -name '*.apk' -exec ls -lh {} \;

      - name: Show staged engine content
        run: find app-android/build/engine-content -maxdepth 2 -mindepth 1 | sort

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: lumen2d-studio-apk
          path: |
            app-android/build/outputs/apk/debug/*.apk
            app-android/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish rolling release with the APK
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena/') || startsWith(github.ref, 'refs/tags/v') || inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest-build' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Lumen2D Studio {0}', github.ref_name) || 'Lumen2D Studio — latest build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            ### Lumen2D Studio — Android 2D game engine & editor

            Install `app-android-debug.apk` (debug-signed) **or** `app-android-release.apk`
            on any Android 7.0+ (API 24) device, then open the built-in
            **Asset Library** and **Sample Games** to try the engine.

            Built from commit ${{ github.sha }} by Lumen2D Engine CI.
          files: |
            app-android/build/outputs/apk/debug/*.apk
            app-android/build/outputs/apk/release/*.apk

  desktop-preview:
    name: Desktop renderer smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Regenerate the asset library and the sample games
        run: gradle :engine-desktop:exportContent --stacktrace
      - name: Headless smoke check of every sample game
        run: gradle :engine-desktop:checkSamples --stacktrace
      - name: Render sample-game screenshots headlessly
        run: gradle :engine-desktop:run --args="--demo all --out build/preview" --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-renderer-preview
          path: engine-desktop/build/preview
          if-no-files-found: ignore
