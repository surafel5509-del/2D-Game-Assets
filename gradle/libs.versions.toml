[versions]
# Toolchain — Kotlin 2.4.20 also matches the compiler bundled in tools/ for local (offline) builds.
kotlin = "2.4.20"
agp = "8.13.0"
# The editor UI is built from framework views (no Compose), so the app only needs core-ktx
# for FileProvider when sharing exported projects.
coreKtx = "1.17.0"
junit = "4.13.2"
# Engine version, surfaced in the app's About screen and in exported projects.
lumen2d = "1.0.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
